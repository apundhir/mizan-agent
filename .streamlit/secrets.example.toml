# Copy to `.streamlit/secrets.toml` for a local live run, or paste these keys into the app's
# Secrets settings on Streamlit Community Cloud. Streamlit exports a ROOT-LEVEL key as an
# environment variable; a key inside a `[section]` is not exported and `tda.review.live` would
# never see it. Never commit `secrets.toml` itself - `.gitignore` refuses it.

# "false" keeps every run in replay: no model call ever reaches the network, and no key is read.
# Flip to "true" only for a live demo, and only after ANTHROPIC_API_KEY is set below.
MIZAN_LIVE_MODE = "false"

# A demo-only key, in its own Anthropic workspace with a monthly spend limit, revoked after use.
# Leave blank while MIZAN_LIVE_MODE is "false" - it is never read until live mode is on.
ANTHROPIC_API_KEY = ""

# Defaults matched here so a deployed app's ceiling is visible without opening the code.
MIZAN_LIVE_RUNS_PER_SESSION = "3"
MIZAN_LIVE_RUNS_PER_PROCESS = "20"

# MIZAN_SINGLE_OPERATOR is deliberately absent from this file. It tells the review screen's run
# picker and the console's replay panel that every run on disk belongs to one trusted person, safe
# for `docker compose` and `make review` on somebody's own machine, never safe for a deployment
# more than one viewer can reach - setting it here would show every viewer of this app every other
# viewer's uploaded files. Leave it unset.

# MIZAN_UPLOAD_ENABLED is deliberately absent too. Unset, the console offers the prepared scenes
# and nothing else, which is what a public link should do: a scene runs this repository's own
# committed corpus, while an upload is an input nobody here authored. The upload path is still in
# the codebase and still tested, and `docker compose` and `make review` turn it on for the trusted
# case. A hosted deployment that leaves this alone never spawns a verification subprocess at all.
