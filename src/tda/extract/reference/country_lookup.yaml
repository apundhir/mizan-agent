    aliases: ["People's Republic of China", PR China, Mainland China]
  "CO":
    name: Colombia
    alpha3: COL
  "CI":
    name: Côte d'Ivoire
    alpha3: CIV
    # `Ivory Coast` is the English exonym a guest-nationality field still carries, and the accented
    # and apostrophised official form is exactly what a PMS export mangles. Added after the eval
    # asked the resolution agent to resolve `Cote dIvoire` and found the lookup had no entry for
    # the country at all - so `fuzzy_candidates` offered nothing and the agent correctly abstained
    # on a country that plainly exists. The case was unsatisfiable, and the gap was real.
    aliases: [Ivory Coast, "Cote d'Ivoire", "Cote dIvoire", "Côte d Ivoire"]
