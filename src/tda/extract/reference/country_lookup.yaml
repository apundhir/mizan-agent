# Country normalisation lookup — the committed table D-NAT-09 requires.
#
# Nationality reaches a metric function only as an ISO 3166-1 alpha-2 code (D-NAT-15). This file is
# the only thing that turns a label in a document into one, and it is **data, not code**: adding a
# country is an edit here plus a regenerated digest, never a change to a parser.
#
# ## Matching (D-NAT-10)
#
# Case-insensitive, punctuation-insensitive, internal whitespace collapsed. So `czech republic`,
# `Czech Republic`, `CZECH  REPUBLIC` and `Czech Rep.` all resolve identically. Both the alpha-2 code
# and the alpha-3 code are themselves keys, so a document that already carries `CZE` or `CZ` resolves
# without a special case — and, more usefully, a document carrying `QQ` is **rejected** rather than
# waved through by a `^[A-Z]{2}$` pattern match.
#
# ## Variant pairs are here on purpose (D-NAT-11)
#
# `Czechia` / `Czech Republic` → CZ. `South Korea` / `Republic of Korea` / `Korea, Republic of` → KR.
# `UK` / `United Kingdom` / `Great Britain` → GB. These are the pairs that a hotel and a regulator
# genuinely spell differently, and resolving them in a lookup is the difference between a variance
# report and an argument about vocabulary.
#
# `England` → GB is included and is not strictly correct as a country: it is a common entry in a
# guest-nationality field, and refusing it would produce a blocking finding on a value whose meaning
# nobody disputes. Recorded here rather than buried in a parser so the choice is visible.
#
# ## This table is NOT exhaustive, and that is a deliberate position
#
# 90 countries: every one present in the demo corpus, the major source markets for a Gulf
# destination, and the documented variant forms. It does not cover all 249 alpha-2 codes.
#
# An unmapped label is **blocking and never guessed** (D-NAT-12) — not by edit distance, not by
# substring match, not by a model's best effort. So the honest consequence of a short table is a
# refusal naming the exact unmatched string, which a human resolves by adding a row here. That is a
# far better failure than a silent mismapping: a guest counted under the wrong country is a wrong
# number presented as a right one, and nothing downstream can detect it.
#
# The resolution agent proposes an addition for a human to accept. It never writes here, and
# its abstention is the blocking finding rather than a fallback (D-NAT-13).

version: 1.0.0
standard: iso_3166_1_alpha_2
clause: D-NAT-09

# Every key is quoted. Only one of these is actually dangerous - YAML 1.1 parses the unquoted token
# `NO` as the boolean `false`, so Norway silently stops being a country and the loader receives a bool
# where it expected a code. Quoting only `NO` would leave a rule that applies to exactly one row,
# which is a rule the next person adding a country will not know about. So all of them are quoted, and
# `normalise._build_index` rejects a non-string key outright with the reason.
countries:
  "AE":
    name: United Arab Emirates
    alpha3: ARE
    aliases: [UAE, Emirates]
  "AR":
    name: Argentina
    alpha3: ARG
  "AT":
    name: Austria
    alpha3: AUT
  "AU":
    name: Australia
    alpha3: AUS
