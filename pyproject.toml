[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mizan"
version = "0.5.2"
description = "Agentic reconciliation and verification system (POC) - deterministic core, agentic edges"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
# Split so CI can install only what a given job needs, and so the deterministic
# core never pulls the model client transitively. The import guard checks source,
# but a dependency graph that makes the violation impossible is better still.
extract = ["pdfplumber>=0.11", "openpyxl>=3.1"]
outputs = ["python-docx>=1.1", "openpyxl>=3.1"]
agents  = ["anthropic>=0.69", "langgraph>=0.2"]
# The screen renders the evidence itself - a PDF page crop and a workbook cell - so it needs the
# readers, not just the UI. Installing `[review]` alone and finding out at the first finding
# that pdfplumber is missing is a worse discovery than a slightly heavier extra.
review  = ["streamlit>=1.39", "pdfplumber>=0.11", "openpyxl>=3.1", "pillow>=10.0"]
datagen = ["reportlab>=4.2", "openpyxl>=3.1"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  # Real stubs rather than an `ignore_missing_imports` override. openpyxl is the one document
  # library the product writes *through* (the annotated workbook in S9), so its API is worth
  # type-checking; reportlab and pdfplumber are read-only and stay in the overrides.
  "types-openpyxl",
]

[project.scripts]
mizan = "tda.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tda"]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtins shadowing
  "C4",          # comprehensions
  "DTZ",         # naive datetime - matters when a verdict carries a timestamp
  "T20",         # no print() in library code
  "SIM",         # simplify
  "TCH",         # type-checking imports
  "PTH",         # pathlib over os.path
  "RUF",
]
ignore = [
  "E501",        # line length is handled by the formatter
  # Prose in docstrings uses en/em dashes and middots deliberately. These rules flag them as
  # confusable characters, which is the right call for identifiers and the wrong one for text.
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at RUNTIME to build validators, so moving a model field's type
# into a TYPE_CHECKING block breaks validation at import. Without this, TC001/TC003 would push
# every contract towards a silent runtime failure.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "tda.policy.loader._Lenient",
  # `AgentOutput` and `Abstention` are `BaseModel` subclasses, but ruff matches the base class
  # written in the file rather than following inheritance - so an agent contract with a
  # first-party field type (`PdfCitation.ref: PdfRef`) is pushed towards the same silent runtime
  # failure unless they are named here too.
  "tda.agents.contracts.base.AgentOutput",
  "tda.agents.contracts.base.Abstention",
]

[tool.ruff.lint.per-file-ignores]
# Tools and tests are CLIs and fixtures: printing is the interface, and the
# arch-guard fixtures deliberately contain code that would otherwise be flagged.
"tools/**"            = ["T20"]
"tests/**"            = ["T20", "S101"]
"tests/arch/fixtures/**" = ["ALL"]
"src/tda/cli.py"      = ["T20"]
# Command-line entry points: printing is the interface, not a debugging leftover. Listed
# explicitly rather than by glob, so `print` cannot quietly appear in library code.
"src/tda/agents/prompts/registry.py"  = ["T20"]
"src/tda/agents/provider/record.py"   = ["T20"]
"src/tda/eval/record_narratives.py"   = ["T20"]
# LangGraph evaluates the state schema's annotations at runtime (`get_type_hints` when the graph
# is built), so every name in a `RunState` field annotation must exist at runtime. Moving them
# into a type-checking block turns `StateGraph(RunState)` into a NameError - the same trap the
# flake8-type-checking settings above record for Pydantic, reached from a different direction.
"src/tda/graph/state.py"              = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["tda"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_explicit = false      # jsonschema and yaml return Any at the boundary
plugins = ["pydantic.mypy"]
mypy_path = "src:tools"
files = ["src", "tools", "tests"]
# The arch fixtures are deliberately-broken *data*, not source. They exist to be rejected by the
# guards, several share module names on purpose, and one imports a package that is not installed.
# Type-checking them would be checking the contents of a test case.
exclude = ["^tests/arch/fixtures/"]

[[tool.mypy.overrides]]
module = [
  "jsonschema", "jsonschema.*",
  "pdfplumber", "pdfplumber.*",
  "reportlab", "reportlab.*",
  "streamlit", "streamlit.*",
  "langgraph", "langgraph.*",
  "docx", "docx.*",
  "anthropic", "anthropic.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "arch: architecture guards - these must fail on a deliberate violation",
  "eval: fixture scoring, slower than unit tests",
]

[tool.coverage.run]
source = ["src/tda"]
branch = true
